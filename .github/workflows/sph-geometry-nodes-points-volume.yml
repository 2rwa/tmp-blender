name: SPH Geometry Nodes point volume

on:
  push:
    branches: [main]
    paths:
      - 'sph-experiments/geometry-nodes-points-volume/**'
      - '.github/workflows/sph-geometry-nodes-points-volume.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "4.0.2"
      SOURCE_RUN_ID: "36360959609"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cheap preflight
        run: |
          python3 -m py_compile \
            sph-experiments/geometry-nodes-points-volume/prepare_points.py \
            sph-experiments/geometry-nodes-points-volume/build_and_render.py

      - name: Download proven 5-second SPH artifact
        uses: actions/download-artifact@v4
        with:
          name: sph-long-duration-5s
          path: input/sph
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Locate VTK cache
        id: source
        run: |
          set -euxo pipefail
          particle="$(find input/sph -type f -name 'ParticleData_Fluid_1.vtk' -print -quit)"
          test -n "$particle"
          sph_dir="$(dirname "$(dirname "$particle")")"
          echo "sph_dir=$sph_dir" >> "$GITHUB_OUTPUT"

      - name: Install point-cache runtime
        run: |
          python -m pip install --disable-pip-version-check meshio numpy

      - name: Build compact point cache
        run: |
          rm -rf output/sph-geometry-nodes-points-volume
          mkdir -p output/sph-geometry-nodes-points-volume/points
          python sph-experiments/geometry-nodes-points-volume/prepare_points.py \
            "${{ steps.source.outputs.sph_dir }}" \
            output/sph-geometry-nodes-points-volume/points
          cat output/sph-geometry-nodes-points-volume/points/manifest.json | head -60

      - name: Restore Blender runtime cache
        id: blender-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build Blender runtime cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender-runtime
          mkdir -p .cache/blender-runtime/blender .cache/blender-runtime/egl .cache/blender-runtime/apt
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender4.0"
          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-$BLENDER_VERSION.sha256" -o /tmp/blender.sha256
          (cd /tmp && grep "  $archive$" blender.sha256 | sha256sum -c -)
          tar -xf "/tmp/$archive" -C .cache/blender-runtime/blender --strip-components=1
          sudo apt-get update
          (cd .cache/blender-runtime/apt && apt-get download libegl1)
          dpkg-deb -x .cache/blender-runtime/apt/libegl1_*.deb .cache/blender-runtime/egl

      - name: Configure Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender-runtime/blender" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Geometry Nodes build, validate and render
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --factory-startup \
              --python-exit-code 1 \
              --python sph-experiments/geometry-nodes-points-volume/build_and_render.py \
              2>&1 | tee output/sph-geometry-nodes-points-volume/blender.log
          test -s output/sph-geometry-nodes-points-volume/validation.json
          test -s output/sph-geometry-nodes-points-volume/preview.png
          test -s output/sph-geometry-nodes-points-volume/media.mp4
          test -s output/sph-geometry-nodes-points-volume/sph-points-geometry-nodes.blend

      - name: Show validation
        run: |
          cat output/sph-geometry-nodes-points-volume/validation.json
          du -sh output/sph-geometry-nodes-points-volume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sph-geometry-nodes-points-volume
          path: output/sph-geometry-nodes-points-volume/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Rebase before persistent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

      - name: Generate persistent result
        run: |
          src="output/sph-geometry-nodes-points-volume"
          dst="results/sph-geometry-nodes-points-volume"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp "$src/validation.json" "$dst/validation.json"
          cp "$src/preview.png" "$dst/preview.png"
          cp "$src/media.mp4" "$dst/media.mp4"
          cp "$src/sph-points-geometry-nodes.blend" "$dst/sph-points-geometry-nodes.blend"
          cp "$src/points/manifest.json" "$dst/manifest.json"
          cp "$src/sph-points.usdc" "$dst/sph-points.usdc"
          cat > "$dst/pages.json" <<JSON
          {
            "title": "SPH Point Cloud — Geometry Nodes Surface",
            "description": "1800点×61フレームのSPH点群を主データにし、Blender Geometry NodesのMesh to Points→Points to Volume→Volume to Meshで水面化した実験。",
            "source_path": "sph-experiments/geometry-nodes-points-volume",
            "preview": "preview.png",
            "media": "media.mp4",
            "validation": "validation.json",
            "source_commit": "$GITHUB_SHA",
            "run_number": "$GITHUB_RUN_NUMBER",
            "run_id": "$GITHUB_RUN_ID"
          }
          JSON
          cat > "$dst/README.md" <<EOF
          # SPH Geometry Nodes point-volume result

          - source: $GITHUB_SHA
          - run: $GITHUB_RUN_ID
          - point cache: sph-points.usdc
          - editable Blender: sph-points-geometry-nodes.blend
          - controls: Radius / Voxel Size / Threshold
          EOF

      - name: Commit persistent result
        id: commit-result
        run: |
          git add results/sph-geometry-nodes-points-volume/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish SPH Geometry Nodes point-volume result [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push persistent result
        if: steps.commit-result.outputs.committed == 'true'
        run: |
          if git push origin HEAD:$GITHUB_REF_NAME; then exit 0; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:$GITHUB_REF_NAME
