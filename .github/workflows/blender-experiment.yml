name: Blender experiment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'docs/**'
      - 'sph-experiments/**'
      - '.github/workflows/sph-*.yml'
      - '.github/workflows/pages-gallery.yml'
      - 'tools/build_pages.py'
      - 'index.html'
      - '.nojekyll'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment folder name under experiments/
        required: true
        default: orbital-sculpture
        type: string

permissions:
  contents: write

concurrency:
  group: tmp-blender-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      experiments: ${{ steps.select.outputs.experiments }}
      standard_experiments: ${{ steps.plan.outputs.standard_experiments }}
      movie_experiments: ${{ steps.plan.outputs.movie_experiments }}
      movie_chunks: ${{ steps.plan.outputs.movie_chunks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compile shared tools
        run: python3 -m py_compile tools/experiment.py tools/build_pages.py

      - name: Select experiments
        id: select
        env:
          MANUAL_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment || '' }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 tools/experiment.py discover \
            --manual "$MANUAL_EXPERIMENT" \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Plan render modes and frame chunks
        id: plan
        env:
          SELECTED_EXPERIMENTS: ${{ steps.select.outputs.experiments }}
        run: |
          python3 tools/experiment.py plan \
            --experiments "$SELECTED_EXPERIMENTS" >> "$GITHUB_OUTPUT"

  render:
    needs: discover
    if: needs.discover.outputs.standard_experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ fromJSON(needs.discover.outputs.standard_experiments) }}
    env:
      EXPERIMENT: ${{ matrix.experiment }}
      BLENDER_VERSION: "4.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile \
            tools/experiment.py \
            "experiments/$EXPERIMENT/scene.py" \
            "experiments/$EXPERIMENT/validate.py"

      - name: Compute render cache key
        id: render-key
        run: |
          content_hash="$(
            find "experiments/$EXPERIMENT" -type f \
              ! -name 'validate.py' \
              ! -name 'README.md' \
              ! -name 'experiment.json' \
              ! -name '*.pyc' \
              ! -path '*/__pycache__/*' \
              -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | cut -d' ' -f1
          )"
          echo "key=blender-render-${RUNNER_OS}-${BLENDER_VERSION}-${EXPERIMENT}-${content_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore render checkpoint
        id: render-cache
        uses: actions/cache/restore@v6
        with:
          path: output
          key: ${{ steps.render-key.outputs.key }}

      - name: Verify restored render checkpoint
        if: steps.render-cache.outputs.cache-hit == 'true'
        run: python3 tools/experiment.py check-render "$EXPERIMENT"

      - name: Restore shared Blender runtime cache
        id: blender-runtime-cache
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build shared Blender runtime cache
        if: steps.render-cache.outputs.cache-hit != 'true' && steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender-runtime
          mkdir -p             .cache/blender-runtime/blender             .cache/blender-runtime/python             .cache/blender-runtime/egl             .cache/blender-runtime/apt

          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender4.0"

          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender.sha256
          (
            cd /tmp
            grep "  $archive$" blender.sha256 | sha256sum -c -
          )

          tar -xf "/tmp/$archive"             -C .cache/blender-runtime/blender             --strip-components=1

          python3 -m pip install             --disable-pip-version-check             --no-compile             --target .cache/blender-runtime/python             "Pillow==10.2.0"

          sudo apt-get update
          (
            cd .cache/blender-runtime/apt
            apt-get download libegl1
          )
          dpkg-deb -x .cache/blender-runtime/apt/libegl1_*.deb .cache/blender-runtime/egl

      - name: Configure shared Blender runtime
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Blender headless runtime
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          blender --version
          python3 -c "from PIL import Image; print('Pillow OK')"
          command -v xvfb-run
          if ldd "$(command -v blender)" | grep -F "not found"; then
            echo "Missing Blender shared library dependency."
            exit 1
          fi
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --python-expr "print('BLENDER_XVFB_OK')"

      - name: Save shared Blender runtime cache
        if: steps.render-cache.outputs.cache-hit != 'true' && steps.blender-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Record Blender version
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p output
          blender --version | tee output/blender-version.txt

      - name: Build scene
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --python "experiments/$EXPERIMENT/scene.py" 2>&1 | tee output/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output/blender-scene.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi

      - name: Save render checkpoint
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: output
          key: ${{ steps.render-key.outputs.key }}

      - name: Ensure validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Validate experiment output
        run: |
          python3 "experiments/$EXPERIMENT/validate.py"
          python3 tools/experiment.py check "$EXPERIMENT"

      - name: Save validated output cache
        uses: actions/cache/save@v6
        with:
          path: output
          key: blender-validated-${{ matrix.experiment }}-${{ runner.os }}-${{ github.run_id }}

      - name: Show outputs
        run: |
          echo "experiment=$EXPERIMENT"
          ls -lh output
          cat output/validation.json

      - name: Upload full experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ matrix.experiment }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          overwrite: true


  prepare_movie:
    needs: discover
    if: needs.discover.outputs.movie_experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.movie_experiments) }}
    env:
      EXPERIMENT: ${{ matrix.item.experiment }}
      BLENDER_VERSION: "4.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile \
            tools/experiment.py \
            "experiments/$EXPERIMENT/scene.py" \
            "experiments/$EXPERIMENT/validate.py"
          if [ -f "experiments/$EXPERIMENT/prepare_assets.py" ]; then
            python3 -m py_compile "experiments/$EXPERIMENT/prepare_assets.py"
          fi

      - name: Restore shared Blender runtime cache
        id: blender-runtime-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build shared Blender runtime cache
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender-runtime
          mkdir -p .cache/blender-runtime/blender .cache/blender-runtime/python .cache/blender-runtime/egl .cache/blender-runtime/apt
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender4.0"
          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-$BLENDER_VERSION.sha256" -o /tmp/blender.sha256
          (cd /tmp && grep "  $archive$" blender.sha256 | sha256sum -c -)
          tar -xf "/tmp/$archive" -C .cache/blender-runtime/blender --strip-components=1
          python3 -m pip install --disable-pip-version-check --no-compile --target .cache/blender-runtime/python "Pillow==10.2.0"
          sudo apt-get update
          (cd .cache/blender-runtime/apt && apt-get download libegl1)
          dpkg-deb -x .cache/blender-runtime/apt/libegl1_*.deb .cache/blender-runtime/egl

      - name: Configure shared Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender-runtime/egl/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Save shared Blender runtime cache
        if: steps.blender-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Prepare optional experiment assets
        run: |
          if [ -f "experiments/$EXPERIMENT/prepare_assets.py" ]; then
            python3 -m pip install --disable-pip-version-check --no-compile "gdown==5.2.0"
            python3 "experiments/$EXPERIMENT/prepare_assets.py"
          else
            echo "No experiment-specific assets to prepare."
          fi

      - name: Verify Blender headless runtime
        run: |
          blender --version
          command -v xvfb-run
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" blender --background --python-expr "print('BLENDER_XVFB_OK')"

      - name: Prepare git and rebase before generation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

      - name: Record Blender version
        run: |
          mkdir -p output
          blender --version | tee output/blender-version.txt

      - name: Build and save pre-render Blend
        env:
          BLENDER_PREPARE_ONLY: "1"
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --python "experiments/$EXPERIMENT/scene.py" 2>&1 | tee output/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output/blender-scene.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi
          python3 tools/experiment.py check-prepared "$EXPERIMENT"

      - name: Generate persistent pre-render result
        run: |
          python3 tools/experiment.py publish-prepared "$EXPERIMENT" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Commit Blend before rendering
        id: commit-prepared
        run: |
          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish $EXPERIMENT pre-render blend [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push pre-render result with one conflict retry
        if: steps.commit-prepared.outputs.committed == 'true'
        run: |
          if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload prepared scene for render jobs
        uses: actions/upload-artifact@v4
        with:
          name: blender-prepared-${{ matrix.item.experiment }}
          path: |
            output/blender-version.txt
            output/*.blend
            output/*-report.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  render_movie_chunks:
    needs: [discover, prepare_movie]
    if: needs.discover.outputs.movie_chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.movie_chunks) }}
    env:
      EXPERIMENT: ${{ matrix.chunk.experiment }}
      BLEND_NAME: ${{ matrix.chunk.blend }}
      FRAME_START: ${{ matrix.chunk.start }}
      FRAME_END: ${{ matrix.chunk.end }}
      CHUNK_ID: ${{ matrix.chunk.chunk }}
      BLENDER_VERSION: "4.0.2"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download prepared scene
        uses: actions/download-artifact@v4
        with:
          name: blender-prepared-${{ matrix.chunk.experiment }}
          path: output

      - name: Restore shared Blender runtime cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1
          fail-on-cache-miss: true

      - name: Configure shared Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender-runtime/egl/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Compute frame cache key
        id: frame-key
        run: |
          blend_sha="$(sha256sum "output/$BLEND_NAME" | cut -d' ' -f1)"
          echo "key=blender-frames-$RUNNER_OS-$BLENDER_VERSION-$EXPERIMENT-$blend_sha-$CHUNK_ID-v1" >> "$GITHUB_OUTPUT"

      - name: Restore PNG frame chunk
        id: frame-cache
        uses: actions/cache/restore@v6
        with:
          path: output/frames
          key: ${{ steps.frame-key.outputs.key }}

      - name: Verify restored PNG frame chunk
        if: steps.frame-cache.outputs.cache-hit == 'true'
        run: python3 tools/experiment.py check-frames "$EXPERIMENT" "$FRAME_START" "$FRAME_END"

      - name: Render PNG frame chunk
        if: steps.frame-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          rm -rf output/frames
          mkdir -p output/frames
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background "output/$BLEND_NAME" -s "$FRAME_START" -e "$FRAME_END" \
              -o "$GITHUB_WORKSPACE/output/frames/frame_####" -F PNG -a 2>&1 | tee output/blender-frames.log
          if grep -Fq "Traceback (most recent call last):" output/blender-frames.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi
          python3 tools/experiment.py check-frames "$EXPERIMENT" "$FRAME_START" "$FRAME_END"

      - name: Save PNG frame chunk cache
        if: steps.frame-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: output/frames
          key: ${{ steps.frame-key.outputs.key }}

      - name: Upload frame chunk for same-run assembly
        uses: actions/upload-artifact@v4
        with:
          name: blender-frames-${{ matrix.chunk.experiment }}-${{ matrix.chunk.chunk }}
          path: output/frames/*.png
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  assemble_movie:
    needs: [discover, prepare_movie, render_movie_chunks]
    if: needs.discover.outputs.movie_experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.movie_experiments) }}
    env:
      EXPERIMENT: ${{ matrix.item.experiment }}
      FRAME_START: ${{ matrix.item.frame_start }}
      FRAME_END: ${{ matrix.item.frame_end }}
      FPS: ${{ matrix.item.fps }}
      PREVIEW_FRAME: ${{ matrix.item.preview_frame }}
      VIDEO_NAME: ${{ matrix.item.video }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Download prepared scene
        uses: actions/download-artifact@v4
        with:
          name: blender-prepared-${{ matrix.item.experiment }}
          path: output

      - name: Download all PNG chunks
        uses: actions/download-artifact@v4
        with:
          pattern: blender-frames-${{ matrix.item.experiment }}-*
          path: output/frames
          merge-multiple: true

      - name: Verify complete frame sequence
        run: |
          python3 tools/experiment.py check-frames "$EXPERIMENT" "$FRAME_START" "$FRAME_END"
          count="$(find output/frames -name 'frame_*.png' -type f | wc -l)"
          echo "frame_count=$count"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build preview and MP4
        run: |
          printf -v preview_path 'output/frames/frame_%04d.png' "$PREVIEW_FRAME"
          cp "$preview_path" output/preview.png
          ffmpeg -y -framerate "$FPS" -start_number "$FRAME_START" -i output/frames/frame_%04d.png \
            -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p "output/$VIDEO_NAME"

      - name: Validate assembled pre-render
        run: |
          python3 "experiments/$EXPERIMENT/validate.py"
          python3 tools/experiment.py check "$EXPERIMENT"
          cat output/validation.json

      - name: Drop duplicate frame copies before final cache
        run: rm -rf output/frames

      - name: Save validated output cache
        uses: actions/cache/save@v6
        with:
          path: output
          key: blender-validated-${{ matrix.item.experiment }}-${{ runner.os }}-${{ github.run_id }}

      - name: Upload assembled experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-${{ matrix.item.experiment }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [discover, render]
    if: needs.discover.outputs.standard_experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        experiment: ${{ fromJSON(needs.discover.outputs.standard_experiments) }}
    env:
      EXPERIMENT: ${{ matrix.experiment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install publish dependencies
        run: |
          python3 -m pip install             --disable-pip-version-check             --no-compile             "Pillow==10.2.0"

      - name: Restore validated output cache
        uses: actions/cache/restore@v6
        with:
          path: output
          key: blender-validated-${{ matrix.experiment }}-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Verify cached output
        run: python3 tools/experiment.py check "$EXPERIMENT"

      - name: Prepare git and rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      - name: Generate persistent result
        run: |
          python3 tools/experiment.py publish "$EXPERIMENT" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Commit result
        id: commit-result
        run: |
          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "chore: publish $EXPERIMENT result [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push result with one conflict retry
        if: steps.commit-result.outputs.committed == 'true'
        run: |
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          echo "Push raced with another writer; rebasing once and retrying."
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"


  publish_movie:
    needs: [discover, assemble_movie]
    if: needs.discover.outputs.movie_experiments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.discover.outputs.movie_experiments) }}
    env:
      EXPERIMENT: ${{ matrix.item.experiment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install publish dependencies
        run: python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Restore validated output cache
        uses: actions/cache/restore@v6
        with:
          path: output
          key: blender-validated-${{ matrix.item.experiment }}-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Verify cached output
        run: python3 tools/experiment.py check "$EXPERIMENT"

      - name: Prepare git and rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

      - name: Generate persistent result
        run: |
          python3 tools/experiment.py publish "$EXPERIMENT" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Commit result
        id: commit-result
        run: |
          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish $EXPERIMENT result [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push result with one conflict retry
        if: steps.commit-result.outputs.committed == 'true'
        run: |
          if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  pages:
    needs: [publish, publish_movie]
    if: >-
      ${{ always() &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
          (needs.publish_movie.result == 'success' || needs.publish_movie.result == 'skipped') &&
          !(needs.publish.result == 'skipped' && needs.publish_movie.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase onto published results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      - name: Build Pages gallery
        run: python3 tools/build_pages.py

      - name: Commit Pages gallery
        id: commit-pages
        run: |
          git add index.html .nojekyll docs/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Pages gallery is already current."
            exit 0
          fi
          git commit -m "chore: publish Pages gallery [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push Pages gallery
        if: steps.commit-pages.outputs.committed == 'true'
        run: |
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          echo "Pages push raced with another writer; rebuilding from latest main."
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python3 tools/build_pages.py
          git add index.html .nojekyll docs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish Pages gallery [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy_pages:
    needs: [pages]
    if: ${{ always() && needs.pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest Pages content
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

