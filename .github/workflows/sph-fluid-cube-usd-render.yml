name: SPH fluid cube USD render

on:
  push:
    branches: [main]
    paths:
      - 'sph-experiments/fluid-cube-usd-render/**'
      - '.github/workflows/sph-fluid-cube-usd-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-blender-sph-fluid-cube-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "4.0.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap preflight
        run: |
          python3 -m json.tool sph-experiments/fluid-cube-usd-render/rigid_body_sequence.json >/dev/null
          python3 -m py_compile \
            sph-experiments/fluid-cube-usd-render/build_combined_usd.py \
            sph-experiments/fluid-cube-usd-render/render_scene.py
          test -s results/sph-direct-usd-topology/fluid-direct-single.usdc

      - name: Restore Blender runtime cache
        id: blender-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build Blender runtime cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender-runtime
          mkdir -p .cache/blender-runtime/blender .cache/blender-runtime/egl .cache/blender-runtime/apt
          archive="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender4.0"
          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-$BLENDER_VERSION.sha256" -o /tmp/blender.sha256
          (cd /tmp && grep "  $archive$" blender.sha256 | sha256sum -c -)
          tar -xf "/tmp/$archive" -C .cache/blender-runtime/blender --strip-components=1
          sudo apt-get update
          (cd .cache/blender-runtime/apt && apt-get download libegl1)
          dpkg-deb -x .cache/blender-runtime/apt/libegl1_*.deb .cache/blender-runtime/egl

      - name: Configure Blender runtime
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender-runtime/blender" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Save Blender runtime cache
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/blender-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build combined USD
        run: |
          set -o pipefail
          mkdir -p output/sph-fluid-cube-render
          blender --background --factory-startup \
            --python-exit-code 1 \
            --python sph-experiments/fluid-cube-usd-render/build_combined_usd.py \
            2>&1 | tee output/sph-fluid-cube-render/build-usd.log

      - name: Render and validate synchronized fluid + cube
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy \
            xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --factory-startup \
              --python-exit-code 1 \
              --python sph-experiments/fluid-cube-usd-render/render_scene.py \
              2>&1 | tee output/sph-fluid-cube-render/render.log
          test -s output/sph-fluid-cube-render/validation.json
          test -s output/sph-fluid-cube-render/preview.png
          test -s output/sph-fluid-cube-render/media.mp4
          test -s output/sph-fluid-cube-render/fluid-cube.blend

      - name: Show validation
        run: |
          cat output/sph-fluid-cube-render/validation.json
          ls -lh output/sph-fluid-cube-render

      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: sph-fluid-cube-usd-render
          path: output/sph-fluid-cube-render/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Rebase before persistent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"

      - name: Generate persistent result
        run: |
          set -euxo pipefail
          src="output/sph-fluid-cube-render"
          dst="results/sph-fluid-cube-usd-render"
          rm -rf "$dst"
          mkdir -p "$dst"
          cp "$src/fluid-cube.usdc" "$dst/fluid-cube.usdc"
          cp "$src/fluid-cube.blend" "$dst/fluid-cube.blend"
          cp "$src/preview.png" "$dst/preview.png"
          cp "$src/media.mp4" "$dst/media.mp4"
          cp "$src/validation.json" "$dst/validation.json"
          cp "$src/combined-usd.json" "$dst/combined-usd.json"

          cat > "$dst/pages.json" <<JSON
          {
            "title": "SPH Fluid + Dynamic Cube — USD Cache Replay",
            "description": "SPlisHSPlasHで計算した流体と動的Cubeを1つのUSDへまとめ、Blenderで13フレーム同期再生した結果。",
            "source_path": "sph-experiments/fluid-cube-usd-render",
            "preview": "preview.png",
            "media": "media.mp4",
            "validation": "validation.json",
            "source_commit": "$GITHUB_SHA",
            "run_number": "$GITHUB_RUN_NUMBER",
            "run_id": "$GITHUB_RUN_ID"
          }
          JSON

          {
            echo "# SPH fluid + dynamic cube USD render"
            echo
            echo "- source: $GITHUB_SHA"
            echo "- run: $GITHUB_RUN_ID"
            echo '- full output: Actions artifact `sph-fluid-cube-usd-render`'
            echo
            echo "Combined topology-changing fluid and dynamic rigid-body cube cache, rendered in Blender."
          } > "$dst/README.md"

      - name: Commit persistent result
        id: commit-result
        run: |
          git add results/sph-fluid-cube-usd-render/
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: publish SPH fluid cube USD render [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push persistent result
        if: steps.commit-result.outputs.committed == 'true'
        run: |
          if git push origin HEAD:$GITHUB_REF_NAME; then
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin HEAD:$GITHUB_REF_NAME
