name: Import existing Pages media

on:
  push:
    paths:
      - '.github/workflows/import-pages-media.yml'

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download existing successful artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/fire /tmp/water
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10896227863/zip"             -o /tmp/fire.zip
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10896581996/zip"             -o /tmp/water.zip
          unzip -q /tmp/fire.zip -d /tmp/fire
          unzip -q /tmp/water.zip -d /tmp/water

          test -s /tmp/fire/fire-column.mp4
          test -s /tmp/water/water-dump.mp4
          cp /tmp/fire/fire-column.mp4 results/fire-column/media.mp4
          cp /tmp/water/water-dump.mp4 results/water-dump/media.mp4

      - name: Rebuild Pages gallery
        run: python3 tools/build_pages.py

      - name: Commit media and remove one-shot importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-pages-media.yml
          git add results/fire-column/media.mp4 results/water-dump/media.mp4 index.html .nojekyll docs/ .github/workflows/import-pages-media.yml
          git commit -m "chore: publish existing Blender videos to Pages [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
